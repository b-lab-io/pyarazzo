arazzo: 1.0.1
info:
    title: E2E Testing Workflow Specification for electricitymap-proxy Service
    version: 1.0.0
    description: This specification outlines the end-to-end testing workflow for the electricitymap-proxy service.
sourceDescriptions:
    - 
        name: electricitymap_proxy_spec
        url: ../api/openapi-public.json
        type: openapi
workflows:
    - 
        workflowId: test-datasource
        summary: Test if the service can handle CRUD operations on datasource.
        inputs:
            type: object
            properties:
                x-partition: $components.inputs.x-partition
                locationId: $components.inputs.locationId
                dataSourceId: $components.inputs.datasourceId
        steps:
            - 
                stepId: create-datasource
                operationId: createDataSource
                description: Create a datasource object for a specific location
                parameters:
                    - 
                        name: x-partition
                        in: header
                        value: $inputs.x-partition
                    - 
                        name: locationId
                        in: path
                        value: $inputs.locationId
                requestBody:
                    contentType: application/json
                    payload:
                        data:
                            lat: 5.9930956844705605
                            lon: -172.99270463893933
                            disableEstimations: true
                            temporalGranularity: hourly
                successCriteria:
                    - 
                        condition: $statusCode == 201
                outputs:
                    datasource-id: '$response.body#/id'
            - 
                stepId: get-created-datasource
                operationId: getDataSource
                parameters:
                    - 
                        name: locationId
                        in: path
                        value: $inputs.locationId
                    - 
                        name: x-partition
                        in: header
                        value: $inputs.x-partition
                    - 
                        name: datasourceId
                        in: path
                        value: $steps.create-datasource.outputs.datasource-id
                successCriteria:
                    - 
                        condition: $statusCode == 200
            - 
                stepId: get-all-datasources
                operationId: getAllDataSources
                parameters:
                    - 
                        name: locationId
                        in: path
                        value: $inputs.locationId
                    - 
                        name: x-partition
                        in: header
                        value: $inputs.x-partition
                successCriteria:
                    - 
                        condition: $statusCode == 200
            - 
                stepId: update-created-datasource
                operationId: updateDataSource
                description: Update the datasource object that was created in the first step
                parameters:
                    - 
                        name: locationId
                        in: path
                        value: $inputs.locationId
                    - 
                        name: x-partition
                        in: header
                        value: $inputs.x-partition
                    - 
                        name: datasourceId
                        in: path
                        value: $steps.create-datasource.outputs.datasource-id
                requestBody:
                    contentType: application/json
                    payload:
                        data:
                            lat: 5.97
                            lon: -172.97
                            disableEstimations: false
                            temporalGranularity: hourly
                successCriteria:
                    - 
                        condition: $statusCode == 200
            - 
                stepId: delete-created-datasource
                operationId: deleteDataSourceById
                description: Delete the datasource object that was created in the first step
                parameters:
                    - 
                        name: locationId
                        in: path
                        value: $inputs.locationId
                    - 
                        name: x-partition
                        in: header
                        value: $inputs.x-partition
                    - 
                        name: datasourceId
                        in: path
                        value: $steps.create-datasource.outputs.datasource-id
                successCriteria:
                    - 
                        condition: $statusCode == 204
components:
    inputs:
        x-partition:
            type: string
        locationId:
            reference: $components.schemas.idString
        dataSourceId:
            reference: $components.schemas.idString
    failureActions:
        auth_failure:
            name: auth_failure
            type: end
            criteria:
                - 
                    condition: $statusCode == 401
        permission_denied:
            name: permission_denied
            type: end
            criteria:
                - 
                    condition: $statusCode == 403
        not_found:
            name: not_found
            type: end
            criteria:
                - 
                    condition: $statusCode == 404
        server_error:
            name: server_error
            type: retry
            retryAfter: 2
            retryLimit: 3
            criteria:
                - 
                    condition: '$statusCode >= 500'
        default_retry:
            name: default_retry
            type: retry
            retryAfter: 1
            retryLimit: 3
        default_failure:
            name: default_failure
            type: end
        cleanup:
            name: cleanup
            type: goto
            stepId: delete-created-datasource
            criteria:
                - 
                    condition: $statusCode == 200
    schemas:
        idString:
            type: string
            maxLength: 36
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
